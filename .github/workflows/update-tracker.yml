name: Update Zoonotic Watch Tracker

on:
  # Allows you to trigger the update manually via GitHub UI or API endpoint
  workflow_dispatch:
    inputs:
      tracker_json_payload:
        description: 'JSON object string generated by Gemini'
        required: true
        type: string

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Append or Update tracker.json
        run: |
          python -c "
          import json, sys

          payload = json.loads('''${{ github.event.inputs.tracker_json_payload }}''')
          
          with open('tracker.json', 'r') as f:
              data = json.load(f)
          
          # Check if story_id already exists to update or append
          story_ids = [item['story_id'] for item in data]
          if payload['story_id'] in story_ids:
              idx = story_ids.index(payload['story_id'])
              data[idx] = payload
          else:
              data.append(payload)
              
          with open('tracker.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add tracker.json
          git commit -m "Auto-update tracker.json via Gemini sync payload"
          git push
