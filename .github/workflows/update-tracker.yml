name: Update Zoonotic Watch Tracker

on:
  workflow_dispatch:
    inputs:
      tracker_json_payload:
        description: 'JSON object string generated by Gemini'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Append or Update tracker.json
        env:
          PAYLOAD: ${{ github.event.inputs.tracker_json_payload }}
        run: |
          python -c "
          import json, os

          raw_payload = os.environ.get('PAYLOAD', '[]')
          payload = json.loads(raw_payload)
          
          with open('tracker.json', 'r') as f:
              data = json.load(f)
          
          incoming_items = payload if isinstance(payload, list) else [payload]
          
          story_map = {item.get('story_id'): item for item in data if 'story_id' in item}
          for new_item in incoming_items:
              s_id = new_item.get('story_id')
              if s_id in story_map:
                  story_map[s_id].update(new_item)
              else:
                  data.append(new_item)
              
          with open('tracker.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add tracker.json
          git commit -m "Auto-update tracker.json via API dispatch"
          git push
